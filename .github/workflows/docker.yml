name: docker

# Builds the headless server image and checks it serves a document and
# compiles a TikZ diagram. Runs when the image's inputs change.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/src/tikz.rs
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: md-render:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve a document and compile a diagram
        run: |
          mkdir -p smoke
          printf '# Hello\n\n```tikz\n\\begin{tikzpicture}\\draw (0,0) -- (1,1);\\end{tikzpicture}\n```\n' > smoke/hello.md
          chmod -R a+rX smoke
          docker run -d --name md -p 127.0.0.1:9999:9999 -v "$PWD/smoke:/docs" md-render:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9999/api/health && break; sleep 1; done
          echo; echo "--- files"
          curl -s http://127.0.0.1:9999/api/files | tee files.json; echo
          grep -q hello.md files.json
          echo "--- state"
          docker exec md sh -c 'ls -la /cache /cache/state/md-render/servers'
          token=$(docker exec md sh -c 'cat /cache/state/md-render/servers/9999.json' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          echo "--- tikz"
          curl -s -o tikz.json -w "%{http_code}\n" -X POST http://127.0.0.1:9999/api/tikz \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"source":"\\begin{tikzpicture}\\draw (0,0) -- (1,1);\\end{tikzpicture}"}'
          head -c 300 tikz.json; echo
          grep -q '"svg":"<svg' tikz.json

      - name: Container logs
        if: always()
        run: docker logs md || true
