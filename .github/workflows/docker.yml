name: docker

# Builds the headless server image and checks it serves a document and
# compiles a TikZ diagram. On pull requests that touch the image's inputs it
# only builds and tests. Called from the release workflow (or run by hand
# with a tag) it also publishes the image to the GitHub Container Registry
# as ghcr.io/aadityasalgarkar/md_render:<tag> and :latest.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - bin/md-render-docker
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/src/tikz.rs
      - package-lock.json
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.7.0
        type: string
        required: true
      latest:
        description: Also tag the image latest
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish the branch under, e.g. v0.7.0 when run on that tag (empty builds without publishing)
        type: string
        required: false
      latest:
        description: Also tag the image latest
        type: boolean
        default: false

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aadityasalgarkar/md_render

jobs:
  # Each architecture builds natively (an emulated Rust build would take
  # hours): amd64 for servers, arm64 for Apple-silicon Macs.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # A release builds its tag; a manual run builds the branch or tag it was
      # started on, and `tag` only names the image.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: md-render:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Image size
        run: docker image ls md-render:ci --format '{{.Repository}}:{{.Tag}} ${{ matrix.arch }} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Serve a document and compile a diagram
        run: |
          mkdir -p smoke
          printf '# Hello\n\n```tikz\n\\begin{tikzpicture}\\draw (0,0) -- (1,1);\\end{tikzpicture}\n```\n' > smoke/hello.md
          chmod -R a+rX smoke
          docker run -d --name md -p 127.0.0.1:9999:9999 -v "$PWD/smoke:/docs" md-render:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9999/api/health && break; sleep 1; done
          echo; echo "--- files"
          curl -s http://127.0.0.1:9999/api/files | tee files.json; echo
          grep -q hello.md files.json
          echo "--- state"
          docker exec md sh -c 'ls -la /cache /cache/state/md-render/servers'
          token=$(docker exec md sh -c 'cat /cache/state/md-render/servers/9999.json' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          echo "--- tikz"
          curl -s -o tikz.json -w "%{http_code}\n" -X POST http://127.0.0.1:9999/api/tikz \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"source":"\\begin{tikzpicture}\\draw (0,0) -- (1,1);\\end{tikzpicture}"}'
          head -c 300 tikz.json; echo
          grep -q '"svg":"<svg' tikz.json

      # The host-install route: bin/md-render-docker as the md-render binary,
      # run by the real mdrender wrapper as the runner's own user.
      - name: Serve through bin/md-render-docker and the mdrender wrapper
        run: |
          # Free port 9999: the first container still holds it.
          docker logs md
          docker rm -f md
          mkdir -p "$HOME/shim-docs"
          printf '# Shim\n\n```tikz\n%%! packages: tikz-cd\n\\begin{tikzcd} A \\arrow[r] & B \\end{tikzcd}\n```\n' > "$HOME/shim-docs/shim.md"
          export MDRENDER_IMAGE=md-render:ci MDRENDER_BIN="$PWD/bin/md-render-docker" MDRENDER_BROWSER=
          bash bin/mdrender "$HOME/shim-docs/shim.md" | tee wrapper.log
          grep -q "server running in the background" wrapper.log
          state="$HOME/.local/state/md-render/servers/9999.json"
          test -f "$state"
          token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' "$state")
          pid=$(sed -n 's/.*"pid":\([0-9]*\).*/\1/p' "$state")
          echo "server pid $pid, seen on the host as: $(ps -o comm= -p "$pid")"
          ps -p "$pid" >/dev/null
          curl -fs -X POST http://127.0.0.1:9999/api/tikz \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"source":"%! packages: tikz-cd\n\\begin{tikzcd} A \\arrow[r] & B \\end{tikzcd}"}' | grep -q '"svg":"<svg'
          ls "$HOME/.cache/md-render/tikz" | grep -q '\.svg$'
          # A second document joins the running server instead of starting one.
          printf '# Second\n' > "$HOME/shim-docs/second.md"
          bash bin/mdrender "$HOME/shim-docs/second.md" | tee join.log
          curl -fs http://127.0.0.1:9999/api/files | grep -q second.md
          # Only the named folder is mounted: not the rest of home.
          docker inspect --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' md-render-9999 | tee mounts.txt
          grep -qx "$HOME/shim-docs" mounts.txt
          ! grep -qx "$HOME" mounts.txt
          # A folder the server cannot see restarts it with that folder added,
          # keeping its tabs.
          mkdir -p "$HOME/other-docs"
          printf '# Other\n' > "$HOME/other-docs/other.md"
          bash bin/mdrender "$HOME/other-docs/other.md" | tee restart.log
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9999/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:9999/api/files | tee files-after.json
          grep -q other.md files-after.json
          grep -q shim.md files-after.json
          grep -q second.md files-after.json
          state="$HOME/.local/state/md-render/servers/9999.json"
          token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' "$state")
          curl -fs -X POST -H "Authorization: Bearer $token" http://127.0.0.1:9999/api/shutdown

      - name: Container logs
        if: failure()
        run: docker logs md || true

      - name: Log in to the GitHub Container Registry
        if: inputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish this architecture
        if: inputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/AadityaSalgarkar/md_render
            org.opencontainers.image.description=MD_RENDER headless server: markdown, plots and TikZ diagrams over HTTP
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}

  # One tag for both architectures; docker pulls the one that matches.
  manifest:
    needs: image
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the architectures
        run: |
          tags=(-t "$IMAGE:${{ inputs.tag }}")
          if [ "${{ inputs.latest }}" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:${{ inputs.tag }}-amd64" "$IMAGE:${{ inputs.tag }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}"
