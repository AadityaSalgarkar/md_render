[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.5"
urlencoding = "2.1.3"
# Headless server mode. tokio/hyper are already in the tree via tauri.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
