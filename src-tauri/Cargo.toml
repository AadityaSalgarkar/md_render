[package]
name = "app"
version = "0.9.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop window (Tauri, WebKit). The Docker image builds without it
# (`--no-default-features`): the server alone, with no WebKit to ship.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-log", "dep:tauri-plugin-deep-link", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2.4.5", optional = true }
urlencoding = "2.1.3"
# Headless server mode. tokio/hyper are already in the tree via tauri.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
# Fetching markdown from the internet. Only the pieces a small download needs;
# rustls keeps the build free of system TLS libraries.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
# TikZ diagrams: Tectonic compiles LaTeX to PDF (in a child process, see
# tikz.rs), hayro-svg turns the page into SVG. Tectonic needs ICU, freetype,
# fontconfig, graphite2, harfbuzz and libpng from the system.
tectonic = "0.17"
hayro-svg = "0.8"
hayro-interpret = "0.8"
sha2 = "0.10"
libc = "0.2"
